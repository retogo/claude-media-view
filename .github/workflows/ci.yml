name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Claude Code ${{ matrix.claude-code }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        claude-code: ['2.1.301', latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
